/* ==== css/components.css ==== */
/* SIMAT components. Every value comes from tokens.css. Prefix sm-. Based on brand/design-system/components/bundle.css. */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 24px; background: var(--ground); color: var(--ink); position: relative; }
[dir="rtl"] body, body[dir="rtl"], .sm-ar, [lang="ar"] { font-family: var(--font-arabic); }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--teal-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
/* Inline brand icons default to text size; specific containers override. */
:where(svg[aria-hidden="true"]:not([class])) { width: 1.1em; height: 1.1em; vertical-align: -0.2em; flex: none; }
.sm-seg > button svg { width: 16px; height: 16px; }
.rtl-flip { width: 1.1em; height: 1.1em; vertical-align: -0.2em; }
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
.sm-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sm-sr:focus { position: fixed; inset-block-start: 8px; inset-inline-start: 8px; width: auto; height: auto; clip: auto; z-index: 100; background: var(--genome-green); color: var(--on-green); padding: 8px 16px; border-radius: var(--radius-pill); }

/* Data values: always LTR, mono */
.sm-variant, .sm-num { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.sm-variant { font-size: 14px; line-height: 20px; background: var(--surface-sunken); padding: 2px var(--space-2); border-radius: var(--radius-sm); }

/* Layout helpers */
.sm-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.sm-stack { display: grid; gap: var(--space-4); }
.sm-between { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; }
.sm-muted { color: var(--ink-muted); }
.sm-small { font-size: 14px; line-height: 20px; }
.sm-caption { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* Button: a pill is a strand with round caps */
.sm-btn { font-size: .9375rem; line-height: 20px; font-weight: 600; min-height: 44px; padding: 10px var(--space-6);
  border-radius: var(--radius-pill); border: 2px solid var(--line-strong); background: transparent; color: var(--ink);
  display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; text-decoration: none; }
.sm-btn:hover { background: var(--surface-sunken); }
.sm-btn-primary { background: var(--genome-green); border-color: var(--genome-green); color: var(--on-green); }
.sm-btn-primary:hover { background: var(--genome-green-hover); border-color: var(--genome-green-hover); }
.sm-btn-link { border-color: transparent; padding: 0 var(--space-2); min-height: 32px; color: var(--teal-ink); text-decoration: underline; }
.sm-btn-link:hover { background: transparent; }
.sm-btn-sm { min-height: 36px; padding: 6px var(--space-4); font-size: .875rem; line-height: 18px; }
.sm-btn[disabled], .sm-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.sm-btn svg { width: 18px; height: 18px; flex: none; }

/* Segmented control (toggle group) */
.sm-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--radius-pill); background: var(--surface-sunken); }
.sm-seg > button { border: 0; background: transparent; color: var(--ink); border-radius: var(--radius-pill); padding: 8px var(--space-4); font-size: .875rem; line-height: 20px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); }
.sm-seg > button[aria-pressed="true"], .sm-seg > button[aria-selected="true"] { background: var(--surface-raised); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 53, 0, .10), 0 0 0 1px var(--line); } /* the iOS / Sehhaty selected segment: a white pill on the sunken track, so only the primary is green */
[data-theme="dark"] .sm-seg { background: var(--ground); }
[data-theme="dark"] .sm-seg > button[aria-pressed="true"], [data-theme="dark"] .sm-seg > button[aria-selected="true"] { background: var(--strand-gold); color: var(--on-gold); }
.sm-seg-dark { background: var(--genome-green-hover); }
.sm-seg-dark > button { color: var(--on-green); }
.sm-seg-dark > button[aria-pressed="true"] { background: var(--strand-gold); color: var(--on-gold); }

/* Tags and badges (text always present) */
.sm-tag { display: inline-flex; align-items: center; gap: var(--space-1); font-size: .8125rem; line-height: 18px; font-weight: 600; padding: 4px var(--space-3); border-radius: var(--radius-pill); border: 1.5px solid var(--line-strong); color: var(--ink); background: var(--panel); white-space: nowrap; }
.sm-tag-green { background: var(--genome-green); border-color: var(--genome-green); color: var(--on-green); }
[data-theme="dark"] .sm-tag-green { background: var(--strand-gold); border-color: var(--strand-gold); color: var(--on-gold); }
.sm-tag-teal { color: var(--teal-ink); border-color: var(--teal-ink); }
.sm-tag-sim { color: var(--ink-muted); border-color: var(--line); font-weight: 400; background: var(--surface); }
.sm-tag-alert { color: var(--acmg-pathogenic); border-color: var(--acmg-pathogenic); }
.sm-tag-warn { color: var(--acmg-likely-pathogenic); border-color: var(--acmg-likely-pathogenic); }
.sm-tag svg { width: 14px; height: 14px; }

/* Hex cell: one unit */
.sm-hex { --hex: 32px; width: var(--hex); height: calc(var(--hex) * 1.1547); display: inline-grid; place-items: center; flex: none;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--genome-green); color: var(--on-green);
  font-weight: 600; font-size: calc(var(--hex) * .42); line-height: 1; }
.sm-hex-teal { background: var(--teal-ink); }

/* Base-pair list */
.sm-bp { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
.sm-bp li { position: relative; padding-inline-start: 28px; }
.sm-bp li::before, .sm-bp li::after { content: ""; position: absolute; inset-inline-start: 0; width: 16px; height: 3px; border-radius: 2px; background: var(--teal-ink); }
.sm-bp li::before { top: 8px; } .sm-bp li::after { top: 14px; }

/* Card */
.sm-card { background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); }
@media (min-width: 640px) { .sm-card { padding: var(--space-6); } }
.sm-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--line); margin-bottom: var(--space-4); }
.sm-card-title { display: flex; align-items: center; gap: var(--space-3); }
.sm-card-title h2, .sm-card-title h3 { font-size: 20px; line-height: 26px; font-weight: 600; }
.sm-well { background: var(--tile); border-radius: var(--radius-md); padding: var(--space-4); }
.sm-callout { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-4); border-radius: var(--radius-md); border: 1.5px solid var(--line-strong); background: var(--surface-raised); }
.sm-callout > svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.sm-callout-alert { border-color: var(--acmg-pathogenic); }
.sm-callout-alert > svg { color: var(--acmg-pathogenic); }
.sm-callout-warn { border-color: var(--acmg-likely-pathogenic); }
.sm-callout-warn > svg { color: var(--acmg-likely-pathogenic); }
.sm-callout-ok { border-color: var(--teal-ink); }
.sm-callout-ok > svg { color: var(--teal-ink); }
.sm-callout-green { background: var(--genome-green); border-color: var(--genome-green); color: var(--on-green); }
.sm-callout-green .sm-muted { color: var(--on-green-muted); }
.sm-callout-green > svg { color: var(--strand-gold); }

/* Key-value rows */
.sm-kv { display: grid; gap: var(--space-2); font-size: 14px; line-height: 20px; }
.sm-kv > div { display: flex; justify-content: space-between; gap: var(--space-4); }
.sm-kv dt { color: var(--ink-muted); }
.sm-kv dd { margin: 0; font-weight: 600; text-align: end; }

/* Range field */
.sm-field { display: grid; gap: 4px; }
.sm-field-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); font-size: .875rem; line-height: 20px; }
.sm-field-head label { color: var(--ink-muted); }
.sm-field-head output { font-weight: 600; font-size: 1rem; }
.sm-field-foot { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.sm-field input[type="range"] { width: 100%; margin: 0; accent-color: var(--genome-green); height: 24px; direction: ltr; } /* a numeric scale never mirrors (brand rule 6): min stays on the left in Arabic too */
[data-theme="dark"] .sm-field input[type="range"] { accent-color: var(--strand-gold); }
.sm-field[aria-disabled="true"] { opacity: .45; pointer-events: none; }

/* Stat tile */
.sm-stat { background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: grid; gap: 2px; }
.sm-stat-label { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.sm-stat-value { font-size: 25px; line-height: 30px; font-weight: 600; }
.sm-stat-note { font-size: 13px; line-height: 18px; font-weight: 600; }
.sm-stat[data-flag="hit"] .sm-stat-note { color: var(--teal-ink); }
.sm-stat[data-flag="miss"] .sm-stat-note { color: var(--ink-muted); font-weight: 400; }

/* Toast */
.sm-toast { position: fixed; inset-block-end: 84px; inset-inline-end: 20px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); background: var(--strand-gold); color: var(--on-gold); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); display: flex; gap: var(--space-3); align-items: flex-start; font-size: 14px; line-height: 20px; box-shadow: 0 8px 24px rgba(5, 20, 2, .25); opacity: 0; transform: translateY(8px); transition: opacity 240ms ease-out, transform 240ms ease-out; pointer-events: none; }
.sm-toast[data-open="true"] { opacity: 1; transform: none; }
.sm-toast > svg { width: 20px; height: 20px; color: var(--on-gold); flex: none; }

/* Modal */
.sm-modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: var(--space-4); background: rgba(5, 20, 2, .55); }
.sm-modal[data-open="true"] { display: flex; }
.sm-modal > div { background: var(--panel); border-radius: var(--radius-md); width: min(560px, 100%); padding: var(--space-6); display: grid; gap: var(--space-4); }

/* Details (accordion) */
details.sm-details { border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); background: var(--surface-raised); }
details.sm-details > summary { cursor: pointer; font-weight: 600; font-size: 14px; line-height: 20px; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
details.sm-details > summary::-webkit-details-marker { display: none; }
details.sm-details > summary svg { width: 16px; height: 16px; transition: transform 240ms ease-out; }
details.sm-details[open] > summary svg { transform: rotate(90deg); }
details.sm-details > div { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--line); font-size: 14px; line-height: 20px; color: var(--ink-muted); display: grid; gap: var(--space-2); }

/* Draw-on motion (the one signature motion) */
@media (prefers-reduced-motion: no-preference) {
  .draw path, .draw line, .draw polyline { stroke-dasharray: var(--len, 600); stroke-dashoffset: var(--len, 600); animation: sm-draw 400ms ease-out forwards; }
  .draw .d2 { animation-delay: 120ms; }
  .draw .d3 { animation-delay: 240ms; }
  @keyframes sm-draw { to { stroke-dashoffset: 0; } }
}

/* ==== css/app.css ==== */
/* SIMAT demo — a state health service, played straight (Sehhaty and the DGA Platforms Code are the craft bar).
   Paper theme. White chrome and white panels on the Paper ground; one green primary per screen.
   Stage scale: 18px root on the projector, 16px on phones. Logical properties throughout; dir="rtl" mirrors for free.
   Every colour is a token (brand/design-system/tokens.json). 4px baseline: all paddings and gaps are multiples of 4. */

html { font-size: 18px; }
body { font-size: 1rem; line-height: 1.5; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin-inline: auto; padding-inline: var(--space-6); }

/* ---------- Masthead: white bar, the real logo files on Paper (EN wordmark ≥ 220 px, AR ≥ 140 px) ---------- */
.mast { background: var(--surface-raised); color: var(--ink); border-bottom: 1px solid var(--line); }
.mast .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); min-height: 88px; padding-block: var(--space-3); }
.mast-brand { display: flex; align-items: center; gap: var(--space-5); min-width: 0; }
.mast-logo { display: block; width: auto; }
.mast-logo-en { height: 64px; }
.mast-logo-ar { height: 80px; }
.mast-logo-sm { display: none !important; }
@media (max-width: 959px) { .mast-logo-sm { display: flex !important; } }
.mast-logo-sm img { height: 36px; width: auto; }
.mast-logo-sm img + img { height: 24px; }
.mast-rule { width: 1px; height: 44px; background: var(--line); flex: none; }
.mast-service { display: grid; gap: 2px; min-width: 0; }
.mast-service strong { font-size: 1rem; line-height: 1.3; font-weight: 600; }
.mast-service span { font-size: .8125rem; line-height: 1.3; color: var(--ink-muted); }
.mast-actions { display: flex; align-items: center; gap: var(--space-2); flex: none; }
.lang-btn { display: inline-flex; align-items: center; gap: var(--space-2); border: 0; background: transparent; color: var(--teal-ink); font-weight: 600; font-size: .9375rem; padding: 8px var(--space-3); border-radius: var(--radius-pill); cursor: pointer; }
.lang-btn:hover { background: var(--tile); }
.lang-btn svg { width: 20px; height: 20px; }

/* ---------- Step strand (service progress) + rulebook: sticky white bar ---------- */
.strand-bar { background: var(--surface-raised); color: var(--ink); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.strand-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); min-height: 64px; }
.steps { display: flex; align-items: center; gap: 0; list-style: none; margin: 0; padding: 0; }
.step { display: inline-flex; align-items: center; gap: var(--space-3); border: 0; background: transparent; padding: 8px var(--space-3); border-radius: var(--radius-pill); font-size: 1rem; line-height: 1.3; font-weight: 600; color: var(--ink-muted); cursor: pointer; }
.step .sm-hex { --hex: 32px; background: var(--surface-sunken); color: var(--ink); }
.step[aria-selected="true"] { color: var(--ink); }
.step[aria-selected="true"] .sm-hex { background: var(--genome-green); color: var(--on-green); }
.step[data-done="true"] .sm-hex { background: var(--teal-ink); color: var(--on-green); }
.step:hover { background: var(--tile); }
.step-link { width: 40px; height: 2px; background: var(--line); flex: none; margin-inline: var(--space-1); }
.rulebook { display: flex; align-items: center; gap: var(--space-3); font-size: .9375rem; color: var(--ink-muted); }

/* ---------- Screen frame ---------- */
main { padding-block: var(--space-6) var(--space-12); display: grid; gap: var(--space-6); }
.screen { display: grid; gap: var(--space-6); }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-2) var(--space-6); }
.page-head h1 { font-size: 1.75rem; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
.page-head .meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); font-size: .9375rem; color: var(--ink-muted); }
.page-head .meta b { color: var(--ink); font-weight: 600; }
.work { display: grid; gap: var(--space-6); align-items: start; }
.work > *, .panel-b > *, .verdict-grid > * { min-width: 0; } /* grid items must not grow to a table's or a nowrap tag's intrinsic width on phones */
@media (min-width: 960px) {
  .work { grid-template-columns: repeat(12, 1fr); }
  .w4 { grid-column: span 4; } .w5 { grid-column: span 5; } .w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
}

/* Panels: white on Paper, 1px line, 8px corners, a soft offset shadow */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: 0 1px 2px rgba(16, 53, 0, .04), 0 6px 20px rgba(16, 53, 0, .05); }
.panel-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--line); font-size: 1rem; font-weight: 600; min-height: 56px; }
.panel-h .sub { font-weight: 400; color: var(--ink-muted); font-size: .9375rem; }
.panel-b { padding: var(--space-6); display: grid; gap: var(--space-6); }
.panel-b > hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: var(--space-4); min-width: 0; }
legend { font-size: 1rem; font-weight: 600; color: var(--ink); padding: 0; margin-bottom: var(--space-2); }
legend small { display: block; font-size: .875rem; font-weight: 400; color: var(--ink-muted); }

/* ---------- Screen 1: the verdict is the dominant object ---------- */
.verdict { display: grid; gap: var(--space-4); }
.verdict h2 { font-size: 2.75rem; line-height: 1.1; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
.verdict p { font-size: 1.125rem; line-height: 1.5; max-width: 60ch; color: var(--ink-muted); }
.verdict-grid { display: grid; gap: var(--space-6); align-items: start; }
@media (min-width: 960px) { .verdict-grid { grid-template-columns: minmax(0, 1fr) 240px; } }
.deciding { display: grid; gap: 2px; padding-top: var(--space-2); border-top: 1px solid var(--line); margin: 0; }
.deciding dt { font-size: .875rem; color: var(--ink-muted); }
.deciding dd { margin: 0; font-size: 3rem; line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
.deciding dd small { font-size: 1.125rem; font-weight: 400; color: var(--ink-muted); margin-inline-start: 4px; }
.deciding dd .ref { display: block; font-family: var(--font-sans); font-size: .8125rem; font-weight: 400; letter-spacing: 0; line-height: 1.3; color: var(--ink-muted); margin-top: var(--space-2); }

/* Lab tables (report order; numbers tabular, units in their own column) */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 1rem; }
.tbl th, .tbl td { text-align: start; padding: 10px var(--space-3); border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th { font-size: .8125rem; font-weight: 600; color: var(--ink-muted); background: var(--tile); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.tbl td.unit { color: var(--ink-muted); white-space: nowrap; }
.tbl tr[data-hit="true"] td.num { font-weight: 600; }
.tbl-cap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); font-size: 1rem; font-weight: 600; margin-bottom: var(--space-2); }

/* Status chips (text always present) */
.status { display: inline-flex; align-items: center; gap: 8px; font-size: .875rem; font-weight: 600; line-height: 1; padding: 8px 12px; border-radius: var(--radius-pill); white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status-ok { color: var(--teal-ink); background: var(--status-ok-bg); }
.status-act { color: var(--acmg-likely-pathogenic); background: var(--status-act-bg); }
.status-due { color: var(--acmg-pathogenic); background: var(--status-due-bg); }
.status-pend { color: var(--ink-muted); background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); } /* Moss on Paper: 5.0:1 */
.status-info { color: var(--ink); background: var(--surface-sunken); }

/* Disclosure (kept for the letter preview and the footer) */
details.basis > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; font-size: 1rem; font-weight: 600; }
details.basis > summary::-webkit-details-marker { display: none; }
details.basis > summary svg { width: 20px; height: 20px; transition: transform 200ms ease-out; color: var(--ink-muted); }
details.basis[open] > summary svg { transform: rotate(90deg); }

/* Action bar: sticky at the screen's end; the one primary action lives here */
.actionbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-6); background: var(--surface-raised); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-md); position: sticky; bottom: var(--space-3); z-index: 30; box-shadow: 0 2px 4px rgba(16, 53, 0, .06), 0 12px 32px rgba(16, 53, 0, .12); }
.actionbar .note { color: var(--ink-muted); font-size: 1rem; display: inline-flex; align-items: center; gap: var(--space-2); }
.actionbar .acts { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.actionbar .sm-btn[disabled] { opacity: .4; }

/* Record (dl) */
.record { display: grid; grid-template-columns: max-content 1fr; gap: 12px var(--space-5); font-size: 1rem; margin: 0; }
.record dt { color: var(--ink-muted); }
.record dd { margin: 0; }
.record-inline { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5); margin: 0; font-size: 1rem; }
.record-inline > div { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); }
.record-inline dt { color: var(--ink-muted); }
.record-inline dd { margin: 0; font-weight: 600; }

/* ---------- Screen 2: the pedigree is the dominant object ---------- */
.pedigree-wrap { overflow-x: auto; }
.pedigree { width: 100%; min-width: 760px; max-height: 480px; height: auto; display: block; direction: ltr; margin-inline: auto; }
.pedigree .ped-line { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.pedigree .ped-sym { stroke: var(--ink); stroke-width: 4; fill: var(--panel); stroke-linejoin: round; transition: stroke 160ms ease-out, fill 160ms ease-out; }
.pedigree .ped-sym-affected { fill: var(--ink); }
.pedigree .ped-dot { fill: var(--ink); }
.pedigree .ped-arrow { stroke: var(--teal-ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.pedigree .ped-label { font-family: var(--font-sans); font-size: 17px; fill: var(--ink); font-weight: 600; }
.pedigree .ped-sub { font-family: var(--font-sans); font-size: 15px; fill: var(--ink-muted); }
.pedigree .ped-sub-teal { fill: var(--teal-ink); font-weight: 600; }
.pedigree .ped-node { cursor: pointer; }
.pedigree .ped-node:hover .ped-sym { stroke: var(--teal-ink); }
.pedigree .ped-node:focus { outline: none; }
.pedigree .ped-node:focus-visible .ped-sym, .pedigree .ped-node[aria-pressed="true"] .ped-sym { stroke: var(--teal-ink); stroke-width: 5; }
.pedigree.ar .ped-label, .pedigree.ar .ped-sub { font-family: var(--font-arabic); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-5); font-size: .9375rem; color: var(--ink-muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend svg { width: 20px; height: 20px; }
.counts-line b { color: var(--ink); font-weight: 600; }

/* Invitation controls + the letter (a sheet, opened on demand) */
.ctl { display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: var(--space-3) var(--space-4); font-size: .9375rem; }
.ctl > span { color: var(--ink-muted); }
.ctl .sm-seg { display: grid; grid-template-columns: 1fr 1fr; }
.ctl .sm-seg > button { justify-content: center; white-space: normal; text-align: center; padding-inline: var(--space-3); line-height: 1.25; }
.paper { border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--paper-sheet); color: var(--paper-ink); padding: var(--space-5); display: grid; gap: var(--space-3); box-shadow: 0 4px 12px rgba(16, 53, 0, .10); }
.paper-cap { font-size: .8125rem; color: var(--paper-muted); }
.paper-head { display: flex; align-items: center; gap: var(--space-3); padding-bottom: var(--space-3); border-bottom: 1px solid var(--line); }
.paper-head img { height: 36px; width: auto; }
.paper-head strong { font-size: .9375rem; line-height: 1.3; }
.paper-head span { display: block; font-size: .8125rem; color: var(--paper-muted); }
.paper-body { display: grid; gap: var(--space-2); font-size: 1rem; }
.paper-body[dir="rtl"] { font-family: var(--font-arabic); font-size: 1.0625rem; line-height: 1.65; }
.paper-body h4 { font-size: 1.0625rem; line-height: 1.35; font-weight: 600; }
.paper-body .privacy { font-size: .875rem; color: var(--paper-muted); padding-top: var(--space-2); border-top: 1px dashed var(--line); }
.paper-foot { display: flex; justify-content: space-between; gap: var(--space-2); font-size: .8125rem; color: var(--paper-muted); padding-top: var(--space-2); border-top: 1px solid var(--line); }

/* Cascade timeline (record panel) */
.tl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
.tl li { display: grid; gap: 4px; justify-items: start; font-size: .875rem; line-height: 1.3; color: var(--ink-muted); position: relative; padding-top: 2px; }
.tl li .sm-hex { --hex: 24px; background: var(--surface-sunken); color: var(--ink); font-size: .75rem; }
.tl li small { font-size: .75rem; color: var(--ink-muted); }
.tl li.done { color: var(--ink); }
.tl li.done .sm-hex { background: var(--teal-ink); color: var(--on-green); }
.tl li.cur { color: var(--ink); font-weight: 600; }
.tl li.cur .sm-hex { background: var(--genome-green); color: var(--on-green); }
.tl li + li::before { content: ""; position: absolute; inset-inline-start: -8px; top: 13px; width: 8px; height: 2px; background: var(--line); }

/* ---------- Screen 3: ferritin trend beside imaging status ---------- */
.trend { display: grid; gap: var(--space-4); }
.trend-chart { width: 100%; height: auto; display: block; direction: ltr; }
.trend-chart .grid { stroke: var(--line); stroke-width: 1; }
.trend-chart .axis { font-family: var(--font-sans); font-size: 13px; fill: var(--ink-muted); }
.trend-chart .limit { stroke: var(--acmg-pathogenic); stroke-width: 2; stroke-dasharray: 6 6; }
.trend-chart .target { stroke: var(--teal-ink); stroke-width: 2; stroke-dasharray: 6 6; }
.trend-chart .limit-label { font-family: var(--font-sans); font-size: 13px; font-weight: 600; fill: var(--acmg-pathogenic); }

// Cascade stage per relative: none → invited → booked → screened. Days are demo values (day 0 = today).
const STAGES = {
  sis14: { stage: 'screened', days: { invited: -41, booked: -37, screened: -22 } },
  bro11: { stage: 'screened', days: { invited: -41, booked: -36, screened: -20 } },
};
const STAGE_ORDER = ['none', 'invited', 'booked', 'screened'];
const CASCADE_TARGET_DAYS = 90;
const BOOK_AFTER_DAYS = 3;
const SCREEN_AFTER_DAYS = 18;

function makeFamily(rulebook) {
  const d = DETAIL[rulebook] || DETAIL.thal;
  const members = {};
  const order = [];
  for (const m of BASE) {
    members[m.id] = { ...m, ...d[m.id], invited: false, stage: 'none', days: {}, ...(STAGES[m.id] || {}) };
    order.push(m.id);
  }
  return { members, order, unions: UNIONS.map(u => ({ ...u, children: [...u.children] })), siblings: SIBLINGS.map(s => [...s]) };
}

// Ids that can still receive an invitation.
function invitable(family) {
  return family.order.filter(id => !family.members[id].proband && ['untested', 'flagged'].includes(family.members[id].status));
}

// Move invited relatives along the cascade as the demo clock advances. The 6-year-old sister's screening
// bundles HLA typing; when she is screened she turns out to be a match (the demo's curative beat).
function advanceCascade(family, day) {
  const changed = [];
  for (const id of family.order) {
    const m = family.members[id];
    if (!['invited', 'prepared', 'booked'].includes(m.status) && m.stage !== 'booked') continue;
    const since = day - (m.days.invited ?? day);
    if (m.stage !== 'screened' && since >= SCREEN_AFTER_DAYS) {
      m.stage = 'screened'; m.status = 'screened'; m.days.screened = (m.days.invited ?? day) + SCREEN_AFTER_DAYS;
      if (!m.days.booked) m.days.booked = (m.days.invited ?? day) + BOOK_AFTER_DAYS;
      if (m.hla === 'pending') m.hla = 'match';
      changed.push(id);
    } else if (m.stage === 'invited' && since >= BOOK_AFTER_DAYS) {
      m.stage = 'booked'; m.status = 'booked'; m.days.booked = (m.days.invited ?? day) + BOOK_AFTER_DAYS;
      changed.push(id);
    }
  }
  return changed;
}

// Relatives the cascade is about: everyone except the proband and the known carriers / affected.
function cascadePool(family) {
  return family.order.filter(id => !family.members[id].proband && !['carrier', 'affected'].includes(family.members[id].status));
}

function siblingsOf(family, id) {
  for (const u of family.unions) if (u.children.includes(id)) return u.children.filter(c => c !== id);
  return [];
}
// ==== js/engine/indices.js ====
// Classic CBC discriminant indices. Pure. Thresholds are the published cut-offs used in the original demo.
//   Mentzer = MCV / RBC            (< 13 suggests thalassaemia trait)
//   Shine & Lal = MCV² × MCH / 100 (< 1530)
//   England & Fraser = MCV − RBC − 5·Hb − 3.4 (< 0)
//   Srivastava = MCH / RBC         (< 3.8)
// An index only votes when the sample is microcytic (MCV < 80 fL; the demo copy and the engine share this number).

const INDEX_CUTOFFS = { mentzer: 13, shineLal: 1530, englandFraser: 0, srivastava: 3.8 };
const MICROCYTIC_MCV = 80;

function computeIndices({ hb, mcv, mch, rbc }) {
  const mentzer = mcv / rbc;
  const shineLal = (mcv * mcv * mch) * 0.01;
  const englandFraser = mcv - rbc - (5 * hb) - 3.4;
  const srivastava = mch / rbc;
  const microcytic = mcv < MICROCYTIC_MCV;
  const flags = {
    mentzer: microcytic && mentzer < INDEX_CUTOFFS.mentzer,
    shineLal: microcytic && shineLal < INDEX_CUTOFFS.shineLal,
    englandFraser: microcytic && englandFraser < INDEX_CUTOFFS.englandFraser,
    srivastava: microcytic && srivastava < INDEX_CUTOFFS.srivastava,
  };
  const votes = Object.values(flags).filter(Boolean).length;
  return { mentzer, shineLal, englandFraser, srivastava, microcytic, flags, votes };
}
// ==== js/engine/screening.js ====
// Result classification. Pure: labs + assay mode → a result key and the numbers the copy needs.
// Branches are the same as the original demo (legacy/index-v1.html updateScreening), made explicit.


const HBA2_TRAIT = 3.5;   // % — β-thalassaemia trait cut-off on HPLC / capillary / gel
const HBS_TRAIT_MIN = 20; // % — HbAS window (simplified)
const HBS_TRAIT_MAX = 48;
const FERRITIN_DEFICIENT = 15; // ng/mL
const MICROCYTIC = MICROCYTIC_MCV;

// Returns { key, vars, idx, triage }
//   key ∈ cbc_suspect | cbc_evaluate | sbthal | hbas | hbss | bthal | ida | normal
//   triage ∈ order_hplc | ida_first | normocytic   (the index-screen line)
function classify(labs, assay) {
  const idx = computeIndices(labs);
  const { hb, mcv, mch, rbc, fer, hba2, hbs, hbf } = labs;
  const vars = {
    hb: hb.toFixed(1), mcv: mcv.toFixed(1), mch: mch.toFixed(1), rbc: rbc.toFixed(2), fer: Math.round(fer),
    hba2: hba2.toFixed(1), hbs: Math.round(hbs), hbf: hbf.toFixed(1), votes: idx.votes,
  };

  let triage = 'normocytic';
  if (idx.votes >= 3) triage = 'order_hplc';
  else if (idx.microcytic && fer < FERRITIN_DEFICIENT) triage = 'ida_first';

  let key;
  if (assay === 'cbc') {
    key = idx.votes >= 3 ? 'cbc_suspect' : 'cbc_evaluate';
  } else if (hbs >= HBS_TRAIT_MIN && hba2 >= HBA2_TRAIT) {
    key = 'sbthal'; // HbS present with raised HbA2: HbS/β-thalassaemia (HbS/β⁺ runs well above the trait window)
  } else if (hbs >= HBS_TRAIT_MIN && hbs <= HBS_TRAIT_MAX) {
    key = 'hbas';
  } else if (hbs > HBS_TRAIT_MAX) {
    key = 'hbss';
  } else if (hba2 >= HBA2_TRAIT) {
    key = 'bthal';
  } else if (mcv < MICROCYTIC && fer < FERRITIN_DEFICIENT) {
    key = 'ida';
  } else {
    key = 'normal';
  }
  return { key, vars, idx, triage };
}

// Does this result justify the family cascade (Tab 2)?
function cascadeEligible(key) {
  return ['sbthal', 'hbas', 'hbss', 'bthal', 'cbc_suspect'].includes(key);
}

const stateListeners = new Set();

function subscribe(fn) { stateListeners.add(fn); return () => stateListeners.delete(fn); }

const CARE_INPUTS = ['preHb', 'facility', 'mriReferred', 'tcdReferred', 'labs', 'preset', 'assay', 'family'];

function set(patch, reason) {
  // A signed plan is invalidated by any later edit to what it covered.
  if (state.signed && !('signed' in patch) && CARE_INPUTS.some(k => k in patch)) patch = { ...patch, signed: false };
  Object.assign(state, patch);
  for (const fn of stateListeners) fn(state, reason || Object.keys(patch));
}

function loadPreset(id) {
  const p = LAB_PRESETS[id];
  if (!p) return;
  set({ preset: id, labs: { ...p.labs }, assay: p.assay }, ['preset', 'labs', 'assay']);
}

// One defaults patch for both reset paths so they cannot drift apart.
function defaultsFor(rb) {
  const preset = DEFAULT_PRESET[rb];
  const p = LAB_PRESETS[preset];
  return {
    rulebook: rb, preset, labs: { ...p.labs }, assay: p.assay,
    family: makeFamily(rb), selected: 'bro20', sender: 'moh', tone: 'official', letterLang: 'ar', delivery: 'authority', day: 0,
    facility: 'tertiary', preHb: 8.6, mriReferred: false, tcdReferred: false, signed: false,
  };
}

function setRulebook(rb) {
  set(defaultsFor(rb), ['rulebook']);
}

function resetAll() {
  set({ ...defaultsFor('thal'), tab: 1 }, ['reset']);
}

function advanceDays(n) {
  const day = state.day + n;
  const changed = advanceCascade(state.family, day);
  set({ day, family: state.family }, ['family', 'day']);
  return changed;
}

function initState() {
  state.family = makeFamily(state.rulebook);
}

// The proband (brother, 20) IS the Tab 1 result: derive his status from the live classification so the
// family loop never contradicts the result reader. Returns { key, status, eligible, vars }.
function probandResult() {
  const r = classify(state.labs, state.assay);
  const status = { bthal: 'carrier', hbas: 'carrier', sbthal: 'carrier', hbss: 'affected', cbc_suspect: 'flagged' }[r.key] || 'nocarrier';
  return { key: r.key, status, eligible: cascadeEligible(r.key), vars: r.vars };
}

function syncProband() {
  const p = probandResult();
  const m = state.family.members.bro20;
  m.status = p.status;
  m.resultKey = p.key;
  return p;
}

  't1.screen.p': '<strong>Why rule-based:</strong> four published discriminant indices, each with its threshold shown, decide the triage. Because premarital centres already pair every CBC with an HPLC result, a federated model across health clusters (raw data staying inside each cluster under PDPL) could later learn carrier signatures from routine CBCs — that is a roadmap item, not part of this demo.',

  't1.evidence.2': '<strong>Aljabry et al. 2024:</strong> 1,871,184 premarital screens in 2011–2018; HbS carriers 4.7%, β-thalassaemia 1.2%.',
  't1.evidence.3': '<strong>Memish & Saeedi 2011:</strong> among the 60% of at-risk couples followed up, voluntary cancellation rose from 9.2% to 51.9% between 2004 and 2009; 48% of at-risk marriages still went ahead in 2009.',
  't1.scd_note': '<strong>Sickle cell rule:</strong> uncomplicated sickle cell trait (HbAS) usually has a normal MCV and RBC count. HbS is never ruled out from a CBC alone — relatives of HbS carriers go straight to HPLC / electrophoresis or a sickling test via the family loop.',

// ==== js/i18n.js ====
// i18n runtime. Dictionaries in i18n/en.js and i18n/ar.js (flat keys). Western numerals in both scripts (brand rule).


const DICTS = { en: EN, ar: AR };

function t(key, vars) {
  const d = DICTS[state.lang] || EN;
  let s = d[key];
  if (s === undefined) s = EN[key];
  if (s === undefined) { console.warn('i18n missing', key); return key; }
  if (vars) for (const k of Object.keys(vars)) s = s.split('{' + k + '}').join(String(vars[k]));
  return s;
}

// Pick from a bilingual object {en, ar}.
function tx(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[state.lang] ?? obj.en ?? '';
}

function dir() { return state.lang === 'ar' ? 'rtl' : 'ltr'; }

function fmt(n, digits = 1) { return Number(n).toFixed(digits); }

function fmtInt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
// ==== js/ui.js ====
// Small DOM helpers: toast, modal with focus return, html builder.


function html(strings, ...vals) {
  return strings.reduce((acc, s, i) => acc + s + (i < vals.length ? (vals[i] ?? '') : ''), '');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

let toastTimer = null;
function toast(message) {
  const el = $('#toast');
  if (!el) return;
  $('#toast-msg', el).textContent = message;
  el.dataset.open = 'true';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.dataset.open = 'false'; }, 4500);
}

let modalReturnFocus = null;
function openModal(id) {
  const m = document.getElementById(id);
  if (!m) return;
  modalReturnFocus = document.activeElement;
  m.dataset.open = 'true';
  const first = m.querySelector('button, [href], input, [tabindex]:not([tabindex="-1"])');
  if (first) first.focus();
  m.addEventListener('keydown', modalKeys);
}

function closeModal(id) {
  const m = document.getElementById(id);
  if (!m) return;
  m.dataset.open = 'false';
  m.removeEventListener('keydown', modalKeys);
  if (modalReturnFocus && modalReturnFocus.focus) modalReturnFocus.focus();
}

function modalKeys(e) {
  const m = e.currentTarget;
  if (e.key === 'Escape') { closeModal(m.id); return; }
  if (e.key !== 'Tab') return;
  const f = Array.from(m.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')).filter(x => !x.disabled);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// Clipboard with a fallback for file:// and older WebViews (navigator.clipboard needs a secure context).
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.insetInlineStart = '-9999px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) { return false; }
}

// Tween a numeric readout (hero tiles, counters). Non-numeric text is set directly.
function animateNumber(el, value, ms = 360) {
  if (!el) return;
  const to = Number(value);
  const first = el.dataset.n === undefined;
  const from = Number(el.dataset.n ?? el.textContent);
  const noMotion = document.documentElement.dataset.motion === 'off' || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (first || !Number.isFinite(to) || !Number.isFinite(from) || from === to || noMotion) {
    el.textContent = String(value); el.dataset.n = String(value); return;
  }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = String(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step); else { el.textContent = String(value); el.dataset.n = String(value); }
  };
  requestAnimationFrame(step);
}

function tag(text, kind = '') {
  return `<span class="sm-tag ${kind}">${esc(text)}</span>`;
}

function simTag(text) {
  return `<span class="sm-tag sm-tag-sim" title="${esc(text)}">${icon('alert')}${esc(text)}</span>`;
}

function hex(n, cls = '') { return `<span class="sm-hex ${cls}" aria-hidden="true">${n}</span>`; }

// Measure path lengths so the draw-on animation starts fully hidden.
function primeDraw(svg) {
  if (!svg) return;
  // Read every length first, then write: interleaving getTotalLength with style writes forces a reflow per path.
  const parts = Array.from(svg.querySelectorAll('path, line, polyline'));
  const lens = parts.map(p => { try { return p.getTotalLength ? p.getTotalLength() : 600; } catch (e) { return 600; /* hidden */ } });
  parts.forEach((p, i) => p.style.setProperty('--len', String(Math.ceil(lens[i]) + 2)));
  svg.classList.remove('draw');
  void svg.getBoundingClientRect();
  svg.classList.add('draw');
}

// Guideline care checks for the affected sister (sis15). Pure. Patient numbers are demo values; every threshold
// is referenced in docs/sources/SOURCES.md (TIF 2021 for TDT: S7–S12; NHLBI 2014 / ASH 2020 for SCD: S17–S21).


const CARE = {
  thal: {
    guideline: 'TIF 2021',
    age: 15, weight: 44,
    transfusions12m: 17,
    hbTarget: [9.5, 10.5],            // pre-transfusion Hb 95–105 g/l (TIF 2021 ch. 2, S7)
    ferritin: { trend: [2120, 2490, 2850], target: 1000, cardiac: 2500, lastDays: 12 },
    chelator: 'DFX', chelatorMax: '28 mg/kg/day',
    mri: { kind: 't2', lastMs: 18, thresholdMs: 20, monthsAgo: 14, intervalMonths: 12 }, // yearly (TIF 2021 ch. 3, S11); starting age not sourced (M6), not shown
    curativeAge: 12,
  },
  scd: {
    guideline: 'ASH 2020 / NHLBI 2014',
    age: 15, weight: 44,
    crises12m: 3, hydroxyurea: '20 mg/kg/day',
    hbTarget: [null, 10.0],           // no chronic lower target in ASH 2020; do not transfuse above 10 g/dL (NHLBI 2014 p. 104, S18)
    ferritin: { trend: [1980, 2210, 2450], target: 1000, cardiac: 2500, lastDays: 20 },
    chelator: 'DFX', chelatorMax: '28 mg/kg/day',
    tcd: { lastVelocity: 185, conditionalFrom: 170, abnormalAbove: 200, monthsAgo: 16, intervalMonths: 12, ageRange: [2, 16] }, // NHLBI 2014 p. 39 (S17)
    curativeAge: 12,
  },
};

function careChecks(s) {
  const rb = s.rulebook;
  const d = CARE[rb];
  const hbState = d.hbTarget[0] !== null && s.preHb < d.hbTarget[0] ? 'low' : s.preHb <= d.hbTarget[1] ? 'ok' : 'high';
  const fer = d.ferritin;
  const ferState = fer.trend[fer.trend.length - 1] > fer.cardiac ? 'cardiac' : fer.trend[fer.trend.length - 1] > fer.target ? 'high' : 'ok';
  const rising = fer.trend[2] > fer.trend[1] && fer.trend[1] > fer.trend[0];

  const sibs = siblingsOf(s.family, 'sis15').map(id => s.family.members[id]);
  const hla = {
    match: sibs.filter(m => m.hla === 'match').map(m => m.id),
    nomatch: sibs.filter(m => m.hla === 'nomatch').map(m => m.id),
    pending: sibs.filter(m => m.hla === 'pending').map(m => m.id),
  };
  const available = s.facility === 'tertiary';
  const tcdState = rb === 'scd' ? (d.tcd.lastVelocity > d.tcd.abnormalAbove ? 'abnormal' : d.tcd.lastVelocity >= d.tcd.conditionalFrom ? 'conditional' : 'normal') : null;
  return { rb, d, hbState, ferState, rising, hla, available, tcdState, referred: rb === 'thal' ? s.mriReferred : s.tcdReferred };
}

// Pedigree layout from the family model. Generic for 2 generations with unions + singles; no SVG here.
// Output: { width, height, nodes: {id: {x, y}}, unions: [{ax, bx, y, midX, consanguineous, kids: [{id, x}], kidY}], siblings: [{ax, bx, y}] }

const PED = { colW: 156, kidW: 146, rowY: [112, 312], symbol: 54, pad: 72 };

function layoutFamily(family) {
  const nodes = {};
  let cursor = PED.pad;
  const unionsOut = [];
  const placed = new Set();

  for (const u of family.unions) {
    const parents = [u.a, u.b].filter(Boolean);
    const nKids = u.children.length;
    const parentsW = parents.length * PED.colW;
    const kidsW = nKids * PED.kidW;
    const w = Math.max(parentsW, kidsW);
    const start = cursor;
    const center = start + w / 2;

    // parents centred in their block
    const pStart = center - parentsW / 2 + PED.colW / 2;
    parents.forEach((id, i) => { nodes[id] = { x: pStart + i * PED.colW, y: PED.rowY[0] }; placed.add(id); });

    // children centred under the union midpoint
    const kStart = center - kidsW / 2 + PED.kidW / 2;
    const kids = u.children.map((id, i) => { const x = kStart + i * PED.kidW; nodes[id] = { x, y: PED.rowY[1] }; placed.add(id); return { id, x }; });

    const ax = nodes[parents[0]].x;
    const bx = parents[1] ? nodes[parents[1]].x : null;
    unionsOut.push({ ax, bx, y: PED.rowY[0], midX: bx === null ? ax : (ax + bx) / 2, consanguineous: !!u.consanguineous, kids, kidY: PED.rowY[1] });
    cursor = start + w + PED.colW * 0.6;
  }
  // anyone not in a union (none in this family, but keep it safe)
  for (const id of family.order) if (!placed.has(id)) { const m = family.members[id]; nodes[id] = { x: cursor, y: PED.rowY[m.gen - 1] }; cursor += PED.colW; }

  const siblings = family.siblings.map(([a, b]) => ({ ax: nodes[a].x, bx: nodes[b].x, y: PED.rowY[0] }));
  const width = cursor - PED.colW * 0.6 + PED.pad;
  const height = PED.rowY[1] + 96;
  return { width, height, nodes, unions: unionsOut, siblings };
}
// ==== js/pedigree/render.js ====
// NSGC-style pedigree SVG from the layout. Square = male, circle = female, filled = affected, centre dot = carrier,
// arrow = proband (teal-ink), double line = consanguineous union. Strokes 4px round caps in ink (DS Pedigree style).
// Colour never carries status alone: every symbol has a text line under it.


function renderPedigree(family, selectedId) {
  const L = layoutFamily(family);
  const S = PED.symbol, h = S / 2;
  const parts = [];

  // sibship line (uncle – father) above generation 1: the standard NSGC sibship bracket with the grandparents off-chart
  for (const s of L.siblings) {
    const y = s.y - h - 26;
    parts.push(`<path class="ped-line" d="M ${s.ax} ${s.y - h - 2} L ${s.ax} ${y} L ${s.bx} ${y} L ${s.bx} ${s.y - h - 2}"/>`);
  }

  // unions
  for (const u of L.unions) {
    if (u.bx !== null) {
      const x1 = u.ax + h + 2, x2 = u.bx - h - 2;
      if (u.consanguineous) {
        parts.push(`<line class="ped-line" x1="${x1}" y1="${u.y - 5}" x2="${x2}" y2="${u.y - 5}"/>`);
        parts.push(`<line class="ped-line" x1="${x1}" y1="${u.y + 5}" x2="${x2}" y2="${u.y + 5}"/>`);
      } else {
        parts.push(`<line class="ped-line" x1="${x1}" y1="${u.y}" x2="${x2}" y2="${u.y}"/>`);
      }
    }
    const sibY = u.kidY - h - 34;
    const topY = u.bx === null ? u.y + h + 2 : u.y + (u.consanguineous ? 5 : 0);
    parts.push(`<line class="ped-line d2" x1="${u.midX}" y1="${topY}" x2="${u.midX}" y2="${sibY}"/>`);
    if (u.kids.length > 1) parts.push(`<line class="ped-line d2" x1="${u.kids[0].x}" y1="${sibY}" x2="${u.kids[u.kids.length - 1].x}" y2="${sibY}"/>`);
    for (const k of u.kids) parts.push(`<line class="ped-line d3" x1="${k.x}" y1="${sibY}" x2="${k.x}" y2="${u.kidY - h - 2}"/>`);
  }

  // nodes
  for (const id of family.order) {
    const m = family.members[id];
    const p = L.nodes[id];
    const affected = m.status === 'affected';
    const symCls = 'ped-sym' + (affected ? ' ped-sym-affected' : '');
    const sym = m.sex === 'M'
      ? `<rect class="${symCls}" x="${p.x - h}" y="${p.y - h}" width="${S}" height="${S}"/>`
      : `<circle class="${symCls}" cx="${p.x}" cy="${p.y}" r="${h}"/>`;
    const dot = m.status === 'carrier' ? `<circle class="ped-dot" cx="${p.x}" cy="${p.y}" r="6"/>` : '';
    // Proband arrow approaches the symbol's lower-left corner from outside the label box (labels sit below the symbol).
    const tx_ = p.x - h - 6, ty = p.y + h - 8;
    const arrow = m.proband
      ? `<path class="ped-arrow" d="M ${tx_ - 30} ${ty + 26} L ${tx_} ${ty} M ${tx_} ${ty} l -13 1 M ${tx_} ${ty} l -1 13"/>`
      : '';
    const name = `${m.proband ? t('t2.hero.proband') : t('rel.' + m.rel)} · ${m.age} ${t('unit.y')}`;
    const statusKey = m.invited ? 'invited' : m.status;
    const status = t('status.' + statusKey);
    const subCls = ['invited', 'flagged', 'untested'].includes(statusKey) ? 'ped-sub ped-sub-teal' : 'ped-sub';
    const pressed = id === selectedId ? 'true' : 'false';
    const label = `${name}. ${status}.`;
    parts.push(`<g class="ped-node" role="button" tabindex="0" data-id="${id}" aria-pressed="${pressed}" aria-label="${esc(label)}">
      <rect x="${p.x - 46}" y="${p.y - h - 6}" width="92" height="${S + 52}" fill="transparent"/>
      ${sym}${dot}${arrow}
      <text class="ped-label" x="${p.x}" y="${p.y + h + 18}" text-anchor="middle">${esc(name)}</text>
      <text class="${subCls}" x="${p.x}" y="${p.y + h + 34}" text-anchor="middle">${esc(status)}</text>
    </g>`);
  }

  return `<svg class="pedigree" viewBox="0 0 ${L.width} ${L.height}" role="group" aria-label="${esc(t('ped.aria'))}">${parts.join('\n')}</svg>`;
}

// Legend glyphs (small inline SVGs) for the pedigree legend.
function legendGlyph(kind) {
  const base = 'stroke="currentColor" stroke-width="2.5" fill="none"';
  switch (kind) {
    case 'male': return `<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" ${base}/></svg>`;
    case 'female': return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" ${base}/></svg>`;
    case 'affected': return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="currentColor"/></svg>`;
    case 'carrier': return `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" ${base}/><circle cx="10" cy="10" r="2.5" fill="currentColor"/></svg>`;
    case 'proband': return `<svg viewBox="0 0 20 20" aria-hidden="true" style="color:var(--teal-ink)"><path d="M3 17 L13 7 M13 7 l-6 1 M13 7 l-1 6" ${base}/></svg>`;
    case 'consang': return `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 8 H18 M2 12 H18" ${base}/></svg>`;
    default: return '';
  }
}

function letterContent(sender, tone, lang) {
  const s = SENDER[sender][lang];
  const b = BODY[tone][lang];
  return { authority: s, authorityOther: SENDER[sender][lang === 'ar' ? 'en' : 'ar'], headline: b.headline, para: b.para(s), privacy: b.privacy };
}

function letterPlainText(sender, tone, lang) {
  const c = letterContent(sender, tone, lang);
  return `${c.authority}\n\n${c.headline}\n\n${c.para}\n\n${c.privacy}`;
}

function flagChip(kind, key) { return `<span class="status status-${kind}">${esc(t(key))}</span>`; }

function updateTab1(root) {
  const s = state;
  const r = classify(s.labs, s.assay);
  const hplc = s.assay === 'hplc';

  $('#case-name', root).textContent = s.preset ? t('preset.' + s.preset) : t('t1.case.edited');
  $('#case-context', root).textContent = t(hplc ? 't1.context.hplc' : 't1.context.cbc');

  $$('#assay-seg button', root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.assay === s.assay)));
  $$('#hplc-box input', root).forEach(i => { i.disabled = !hplc; });
  $('#hplc-box', root).style.opacity = hplc ? '' : '.5';

  for (const id of [...CBC, ...HPLC]) {
    const inp = $('#lab-' + id, root);
    if (document.activeElement !== inp) inp.value = s.labs[id];
    const val = fmt(s.labs[id], LAB_RANGES[id].digits);
    const readout = `${val} ${t('unit.' + id)}`;
    $('#out-' + id, root).textContent = readout;
    inp.setAttribute('aria-valuetext', readout);
    $('#lab-val-' + id, root).textContent = val;
  }
  // Lab rows: fractions only when the confirmatory assay exists; flags only where a published rule applies.
  $('#labtbl-hplc', root).hidden = !hplc;
  $('#labtbl-cap', root).textContent = t(hplc ? 't1.labtbl.hplc' : 't1.labtbl.cbc');
  const flags = {
    hba2: s.labs.hba2 >= HBA2_TRAIT ? ['act', 'lab.flag.high'] : ['pend', 'lab.flag.in'],
    hbs: s.labs.hbs >= 1 ? ['act', 'lab.flag.high'] : ['pend', 'lab.flag.in'],
    hbf: s.labs.hbf >= 2 ? ['act', 'lab.flag.high'] : ['pend', 'lab.flag.in'],
    mcv: s.labs.mcv < MICROCYTIC_MCV ? ['act', 'lab.flag.micro'] : ['pend', 'lab.flag.in'],
    fer: s.labs.fer < FERRITIN_DEFICIENT ? ['act', 'lab.flag.lowfer'] : ['pend', 'lab.flag.in'],
  };
  for (const id of [...CBC, ...HPLC]) {
    const f = flags[id];
    $('#lab-flag-' + id, root).innerHTML = f ? flagChip(f[0], f[1]) : '';
    $('#lab-row-' + id, root).dataset.hit = String(!!(f && f[0] === 'act'));
  }

  const idx = r.idx;
  const vals = { mentzer: idx.mentzer, shineLal: idx.shineLal, englandFraser: idx.englandFraser, srivastava: idx.srivastava };
  for (const id of IDX) {
    $('#val-' + id, root).textContent = fmt(vals[id], 1);
    const hit = idx.flags[id];
    $('#note-' + id, root).innerHTML = flagChip(hit ? 'act' : 'pend', hit ? 'idx.flag' : 'idx.noflag');
  }
  $('#vote-chip', root).textContent = t('t1.vote', { votes: idx.votes });

  $('#spec-type', root).textContent = t(hplc ? 't1.context.hplc' : 't1.context.cbc');
  $('#result-title', root).textContent = t('res.' + r.key + '.h', r.vars);

  if (root.dataset.lastKey !== r.key) { root.dataset.lastKey = r.key; $('#sr-result', root).textContent = t('res.' + r.key + '.h', r.vars); }

  to2.title = eligible ? '' : t('t1.to_tab2.why');
  $('#action-note', root).textContent = eligible ? t('t1.action.ok') : t('t1.action.na');
}

// Invitations are simulated: nothing is sent anywhere.


function invite(ids, root) {
  const fam = state.family;
  if (!syncProband().eligible) { toast(t('t2.gate.toast')); return; }
  const done = [];
  const self = state.delivery === 'self';
  for (const id of ids) {
    const m = fam.members[id];
    if (!['untested', 'flagged'].includes(m.status)) continue;
    m.invited = true; m.status = self ? 'prepared' : 'invited'; m.stage = 'invited'; m.days = { ...m.days, invited: state.day }; done.push(id);
  }
  if (!done.length) return;

function renderTimeline(root, m, today) {
  const ol = $('#rel-tl', root);
  const note = $('#rel-tl-note', root);
  if (m.proband || ['carrier', 'affected', 'nocarrier'].includes(m.status)) { ol.innerHTML = ''; note.textContent = t('tl.na'); return; }
  const reached = STAGE_ORDER.indexOf(m.stage);
  const steps = ['invited', 'booked', 'screened', 'private'];
  ol.innerHTML = steps.map((st, i) => {
    const idx = i + 1;
    const done = st === 'private' ? m.stage === 'screened' : reached >= idx;
    const cur = !done && (st === 'private' ? m.stage === 'screened' : reached === idx - 1) && m.stage !== 'none';
    const day = m.days[st];
    const when = day === undefined ? '' : day === today ? t('tl.today') : day < today ? t('tl.days_ago', { d: today - day }) : '';
    return `<li class="${done ? 'done' : cur ? 'cur' : ''}"><span class="sm-hex" aria-hidden="true">${idx}</span><span>${esc(t('tl.' + st))}</span><small>${esc(when)}</small></li>`;
  }).join('');
  if (m.stage === 'none') note.textContent = t('tl.not_started');
  else if (m.stage === 'screened') note.textContent = t('tl.done_in', { d: (m.days.screened - m.days.invited), target: CASCADE_TARGET_DAYS });
  else note.textContent = t('tl.in_progress', { d: today - m.days.invited, target: CASCADE_TARGET_DAYS });
}

  </details>`;

// Three serum ferritin values as bars against the target and cardiac-risk lines. Numbers are printed on the bars;
// colour never carries the state alone.
function trendChart(d) {
  const f = d.ferritin;
  const W = 560, H = 220, padL = 16, padR = 156, padT = 16, padB = 36;
  const max = 3500;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const n = f.trend.length, slot = (W - padL - padR) / n, bw = Math.min(88, slot * 0.6);
  const bars = f.trend.map((v, i) => {
    const x = padL + slot * i + (slot - bw) / 2;
    const cls = v > f.cardiac ? 'bar bar-over' : v > f.target ? 'bar bar-high' : 'bar';
    const inside = (y(0) - y(v)) > 44; // print the value inside the bar when it fits, else just above it
    const when = i === n - 1 ? t('t3.chart.last', { d: f.lastDays }) : t('t3.chart.ago', { m: (n - 1 - i) * 3 });
    return `<rect class="${cls}" x="${x}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="2"/>
      <text class="val${inside && v > f.target ? ' val-on' : ''}" x="${x + bw / 2}" y="${inside ? y(v) + 24 : y(v) - 8}" text-anchor="middle">${fmtInt(v)}</text>
      <text class="when" x="${x + bw / 2}" y="${H - padB + 20}" text-anchor="middle">${esc(when)}</text>`;
  }).join('');
  const lines = `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>
    <line class="target" x1="${padL}" x2="${W - padR}" y1="${y(f.target)}" y2="${y(f.target)}"/>
    <text class="target-label" x="${W - padR + 8}" y="${y(f.target) + 4}"><tspan direction="ltr" unicode-bidi="isolate">${esc(t('t3.chart.target', { t: fmtInt(f.target) }))}</tspan></text>
    <line class="limit" x1="${padL}" x2="${W - padR}" y1="${y(f.cardiac)}" y2="${y(f.cardiac)}"/>
    <text class="limit-label" x="${W - padR + 8}" y="${y(f.cardiac) + 4}"><tspan direction="ltr" unicode-bidi="isolate">${esc(t('t3.chart.limit', { l: fmtInt(f.cardiac) }))}</tspan></text>`;
  const aria = t('t3.chart.aria', { a: fmtInt(f.trend[0]), b: fmtInt(f.trend[1]), c: fmtInt(f.trend[2]), t: fmtInt(f.target), l: fmtInt(f.cardiac) });
  return `<svg class="trend-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${lines}${bars}</svg>`;
}

  $('#n-img', root).textContent = t('row.img.name.' + rb);
  $('#g-img', root).textContent = t('row.img.guide.' + rb);
  $('#c-img', root).textContent = rb === 'scd' ? t('row.img.cur.scd', { v: img.lastVelocity, state: t('tcd.' + c.tcdState), m: img.monthsAgo }) : t('row.img.cur', { m: img.monthsAgo });
  const imgKind = c.referred ? 'ok' : 'due';
  const imgKey = c.referred ? 'st.referred' : c.available ? 'st.due' : 'st.na';
  status($('#s-img', root), imgKind, imgKey);
  status($('#s-img-top', root), imgKind, imgKey);
  $('#img-big', root).innerHTML = rb === 'scd'
    ? `<b class="sm-num">${img.lastVelocity} cm/s</b> <span class="sm-muted">· ${esc(t('tcd.' + c.tcdState))}</span>`
    : `<b class="sm-num">${img.lastMs} ms</b> <span class="sm-muted">· ${esc(t('t3.img.thr', { thr: img.thresholdMs }))}</span>`;
  $('#img-when', root).textContent = t('row.img.cur', { m: img.monthsAgo });
  $('#img-p', root).innerHTML = c.available
    ? t('t3.c4.img.p.' + rb + '.tertiary', { ms: img.lastMs || '', thr: img.thresholdMs || '', v: img.lastVelocity || '', m: img.monthsAgo })
    : t('t3.c4.img.p.' + rb + '.peripheral', { v: fmtInt(d.ferritin.trend[2]) });
  const rbtn = $('#refer-btn', root);
  rbtn.innerHTML = c.referred ? esc(t('t3.c4.refer.sent.' + rb)) : `${icon('connect')}${esc(t('t3.c4.refer.' + rb))}`;
  rbtn.disabled = c.referred;

  $('#n-adh', root).textContent = t('row.adh.name');
  $('#g-adh', root).textContent = t('row.adh.guide');
  $('#c-adh', root).textContent = t('row.adh.cur');
  status($('#s-adh', root), 'act', 'st.act');

  const nm = c.hla.nomatch.map(id => `${t('rel.' + s.family.members[id].rel)} ${s.family.members[id].age}`).join(t('list.sep'));
  const pend = c.hla.pending.map(id => `${t('rel.' + s.family.members[id].rel)} ${s.family.members[id].age}`).join(t('list.sep'));
  const pendingInvited = c.hla.pending.some(id => s.family.members[id].invited);
  const match = c.hla.match.map(id => `${t('rel.' + s.family.members[id].rel)} ${s.family.members[id].age}`).join(t('list.sep'));
  $('#n-hla', root).textContent = t('row.hla.name');
  $('#g-hla', root).textContent = t('row.hla.guide');
  $('#c-hla', root).textContent = match ? t('row.hla.cur.match', { who: match }) : t('row.hla.cur', { n: c.hla.nomatch.length, p: c.hla.pending.length });
  status($('#s-hla', root), match ? 'ok' : pendingInvited ? 'ok' : 'pend', match ? 'st.match' : pendingInvited ? 'st.queued' : 'st.pend');
  $('#hla-text', root).innerHTML = match
    ? `<strong>${esc(t('t3.c5.hla.h'))}</strong> ${t('t3.c5.hla.match', { who: match })}`
    : `<strong>${esc(t('t3.c5.hla.h'))}</strong> ${t('t3.c5.hla.p', { nomatch: nm || '—', pending: pend || '—' })} ${pendingInvited ? t('t3.c5.hla.invited') : t('t3.c5.hla.not_invited')}`;

  $('#n-gene', root).textContent = t('row.gene.name');
  $('#g-gene', root).textContent = t('row.gene.guide');
  $('#c-gene', root).textContent = match ? t('row.gene.cur.match') : t('row.gene.cur', { age: d.age });
  status($('#s-gene', root), 'info', match ? 'st.hsct' : 'st.eligible');

  // Summary line from the row chips
  const chips = $$('.check > summary .status', root).map(el => el.className);
  const n = k => chips.filter(cl => cl.includes('status-' + k)).length;
  const total = 6, referOut = c.available ? 0 : 1;
  $('#n-doable', root).textContent = `${total - referOut}/${total}`;
  $('#n-refer', root).textContent = String(referOut);
  $('#n-ok', root).textContent = String(n('ok'));
  $('#n-act', root).textContent = String(n('act') + n('due'));
  $('#care-summary', root).textContent = s.signed ? t('t3.hero.signed') : t('t3.summary', { doable: total - referOut, total, ref: referOut, act: n('act') + n('due') });
  $('#hero-fac-p', root).textContent = t(c.available ? 't3.hero.fac.tertiary.' + rb : 't3.hero.fac.peripheral.' + rb);
  $('#sign-label', root).textContent = t(s.signed ? 't3.sign.done' : 't3.sign.btn');
}

function renderShell() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = dir();
  document.title = t('app.doc_title');

  $('#mast').innerHTML = `<div class="wrap">
    <div class="mast-brand">
      ${logoMarkup()}
      <div class="mast-rule" aria-hidden="true"></div>
      <div class="mast-service"><strong>${esc(t('mast.service'))}</strong><span>${esc(t('mast.demo'))}</span></div>
    </div>
    <div class="mast-actions">
      <button type="button" class="lang-btn" id="lang-toggle" lang="${state.lang === 'ar' ? 'en' : 'ar'}">${LANG_GLYPH}<span>${state.lang === 'ar' ? 'English' : 'العربية'}</span></button>
    </div>
  </div>`;

  $('#strand').innerHTML = `<div class="wrap">
    <div class="steps" role="tablist" aria-label="${esc(t('app.tabs'))}">
      ${[1, 2, 3].map(n => `<button role="tab" class="step" id="tab-btn-${n}" aria-controls="tab-${n}" aria-selected="false" tabindex="-1">${hex(n)}<span>${esc(t('tab.' + n))}</span></button>${n < 3 ? '<span class="step-link" aria-hidden="true"></span>' : ''}`).join('')}
    </div>
    <div class="rulebook">
      <span id="rb-label">${esc(t('mast.rulebook'))}</span>
      <div class="sm-seg" role="group" aria-labelledby="rb-label" id="rb-seg">
        <button type="button" data-rb="thal">${esc(t('rulebook.thal'))}</button>
        <button type="button" data-rb="scd">${esc(t('rulebook.scd'))}</button>
      </div>
    </div>
  </div>`;

  $('#presenter').innerHTML = `<div class="wrap">
    <div class="sm-row" style="gap:var(--space-3)">
      <strong>${esc(t('presenter.h'))}</strong>
      <span id="preset-label">${esc(t('presenter.case'))}</span>
      <div class="sm-seg" id="presets" role="group" aria-labelledby="preset-label">${PRESETS_BY_RULEBOOK[state.rulebook].map(p => `<button type="button" data-preset="${p}" aria-pressed="false">${esc(t('preset.' + p))}</button>`).join('')}</div>
    </div>
    <div class="sm-row" style="gap:var(--space-2)">
      <span id="clock">${esc(t('presenter.day', { d: state.day }))}</span>
      <button type="button" class="sm-btn sm-btn-sm" id="advance-btn">${esc(t('presenter.advance'))}</button>
      <button type="button" class="sm-btn sm-btn-sm" id="reset-btn" title="${esc(t('app.reset.title'))}">${esc(t('app.reset'))}</button>
    </div>
  </div>`;

    const names = changed.map(id => t('rel.' + state.family.members[id].rel) + ' ' + state.family.members[id].age).join(t('list.sep'));
    toast(changed.length ? t('toast.advanced', { n: 30, who: names }) : t('toast.advanced.none', { n: 30 }));
  });
  $$('[role="tab"]').forEach((b, i) => {
    b.addEventListener('click', () => set({ tab: i + 1 }));
    b.addEventListener('keydown', e => {
      const rtl = state.lang === 'ar';
      let n = null;
      if (e.key === 'ArrowRight') n = ((i + (rtl ? -1 : 1) + 3) % 3) + 1;
      else if (e.key === 'ArrowLeft') n = ((i + (rtl ? 1 : -1) + 3) % 3) + 1;
      else if (e.key === 'Home') n = 1;
      else if (e.key === 'End') n = 3;
      if (n === null) return;
      e.preventDefault();

// Re-mounting the whole UI (language / rulebook / reset) must not lose the user's place.
function snapshotUi() {
  const active = document.activeElement && document.activeElement.id;
  const open = $$('details[open]').map(d => d.id).filter(Boolean);
  return { active, open };
}
function restoreUi(snap) {
  for (const id of snap.open) { const d = document.getElementById(id); if (d) d.open = true; }
  if (snap.active) { const el = document.getElementById(snap.active); if (el && el.focus) el.focus(); }
}

function mountViews() {
  mountTab1($('#tab-1'));
  mountTab2($('#tab-2'));
  mountTab3($('#tab-3'));
}

function syncChrome() {
  for (const n of [1, 2, 3]) {
    const sel = n === state.tab;
    const b = $('#tab-btn-' + n);
    b.setAttribute('aria-selected', String(sel));
    b.dataset.done = String(n < state.tab);
    b.tabIndex = sel ? 0 : -1;
    $('#tab-' + n).hidden = !sel;
  }
  $$('#rb-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rb === state.rulebook)));
  $$('#presets button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.preset === state.preset)));
  const clock = $('#clock'); if (clock) clock.textContent = t('presenter.day', { d: state.day });
  if (location.hash !== '#tab-' + state.tab) history.replaceState(null, '', '#tab-' + state.tab);
}

function onChange(s, reason) {
  const r = Array.isArray(reason) ? reason : [reason];
  if (r.includes('lang') || r.includes('rulebook') || r.includes('reset')) {
    const snap = snapshotUi();
    renderShell(); mountViews(); syncChrome(); restoreUi(snap);
    if (r.includes('rulebook')) toast(t('toast.rulebook.' + s.rulebook));
    if (r.includes('reset')) toast(t('toast.reset'));
    return;
  }
  syncChrome();
  updateTab1($('#tab-1'));
  updateTab2($('#tab-2'), r);
  updateTab3($('#tab-3'));
  if (r.includes('tab')) { window.scrollTo({ top: 0 }); const p = $('#tab-' + s.tab + ' svg.pedigree'); if (p) primeDraw(p); }
}

function boot() {
  initState();
  const m = location.hash.match(/#tab-([123])/);
  if (m) state.tab = Number(m[1]);
  if (/^ar\b/i.test(navigator.language || '') && !location.search.includes('lang=en')) state.lang = 'ar';
  if (location.search.includes('lang=ar')) state.lang = 'ar';
  renderShell(); mountViews(); syncChrome();
  // syncChrome always leaves a #tab-N hash in the URL; the fragment scroll that fires at load would then focus the
  // panel and jump past the masthead (178 px). Clear the hash until the load has settled, on every load, with or without a hash.
  history.replaceState(null, '', location.pathname + location.search);
  window.addEventListener('load', () => window.scrollTo(0, 0), { once: true });
  setTimeout(() => { window.scrollTo(0, 0); history.replaceState(null, '', '#tab-' + state.tab); }, 0);
  subscribe(onChange);
  window.addEventListener('hashchange', () => { const h = location.hash.match(/#tab-([123])/); if (h && Number(h[1]) !== state.tab) set({ tab: Number(h[1]) }); });
}

// Test hook (tests/judge.test.html drives the real app through this).
window.__simat = { state, set, setRulebook, resetAll, loadPreset, advanceDays };

boot();
})();
